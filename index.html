<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시사상식 스터디 소재 저장소</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a href="?view=list" data-view-link="list" class="brand">Study Issue Bank</a>
      <nav class="top-nav" aria-label="주요 메뉴">
        <a href="?view=list" data-view-link="list" id="nav-list">소재 목록</a>
        <a href="?view=add" data-view-link="add" id="nav-add">소재 등록</a>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <section id="view-list" class="view" aria-labelledby="list-page-title">
      <div class="page-shell">
        <header class="page-head">
          <div>
            <p class="kicker">Main</p>
            <h1 id="list-page-title">스터디 소재 목록</h1>
            <p>질문, 정답, 한 줄 해설을 빠르게 검색하고 필터링하세요.</p>
          </div>
          <a href="?view=add" data-view-link="add" class="primary-link">새 소재 등록</a>
        </header>

        <div class="toolbar">
          <input id="search-input" type="search" placeholder="질문, 정답, 한 줄 해설, 작성자, 출처 검색" aria-label="검색">
          <select id="filter-category" aria-label="대분류 필터"></select>
          <button id="refresh-button" type="button">새로고침</button>
        </div>

        <p id="list-status" class="status" aria-live="polite"></p>
        <div id="list-loading" class="loading-inline" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span>소재 목록을 불러오는 중입니다. 잠시만 기다려주세요.</span>
        </div>
        <div id="cards" class="cards" aria-live="polite"></div>
      </div>
    </section>

    <section id="view-add" class="view" aria-labelledby="form-page-title">
      <div class="page-shell narrow">
        <header class="page-head">
          <div>
            <p class="kicker">Create</p>
            <h1 id="form-page-title">소재 등록</h1>
            <p>여러 소재를 한 번에 입력하고 일괄 등록할 수 있습니다.</p>
          </div>
          <a href="?view=list" data-view-link="list" class="secondary-link">목록으로 이동</a>
        </header>

        <form id="material-form" class="form-card" novalidate>
          <div class="shared-grid">
            <div class="field">
              <label for="studyCode">스터디 코드</label>
              <input id="studyCode" name="studyCode" type="text" required placeholder="스터디 코드를 입력해주세요">
            </div>

            <div class="field">
              <label for="author">작성자</label>
              <input id="author" name="author" type="text" required placeholder="이름">
            </div>

            <div class="field full">
              <label for="category">대분류</label>
              <select id="category" name="category" required></select>
            </div>
          </div>

          <div class="entries-head">
            <h2>등록 항목</h2>
          </div>

          <div id="entries" class="entries"></div>

          <div class="submit-row">
            <button id="add-entry-button" type="button" class="ghost-btn">항목 추가</button>
            <button id="submit-button" type="submit">
              <span id="submit-text">일괄 등록</span>
              <span id="submit-spinner" class="spinner button-spinner" aria-hidden="true" hidden></span>
            </button>
            <p id="form-message" class="message" role="status" aria-live="polite"></p>
          </div>
        </form>
      </div>
    </section>
  </main>

  <template id="entry-template">
    <article class="entry-card" data-entry>
      <div class="entry-head">
        <strong class="entry-index">소재 1</strong>
        <button type="button" class="remove-entry" aria-label="항목 삭제">삭제</button>
      </div>

      <div class="field">
        <label>질문</label>
        <textarea class="entry-question" rows="3" placeholder="질문을 입력하세요" required></textarea>
      </div>

      <div class="field">
        <label>정답</label>
        <input class="entry-answer" type="text" placeholder="정답을 입력하세요" required>
      </div>

      <div class="field">
        <label>한 줄 해설</label>
        <input class="entry-description" type="text" placeholder="핵심 설명 한 줄" required>
      </div>

      <div class="field">
        <label>출처 링크/비고</label>
        <input class="entry-source" type="text" placeholder="기사 링크 또는 메모">
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
